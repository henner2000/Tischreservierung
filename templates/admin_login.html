<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-Login - Tischreservierung</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Admin-Login</h1>
            <p class="subtitle"><a href="/">Zurück zur Reservierung</a></p>
        </header>

        <div class="form-section">
            {% if fehler %}
                <p class="status-fehler" style="margin-bottom: 1rem;">{{ fehler }}</p>
            {% endif %}

            <form method="POST" action="{{ url_for('admin_login') }}">
                <div class="form-group">
                    <label for="passwort">Passwort</label>
                    <input type="password" id="passwort" name="passwort" placeholder="Admin-Passwort eingeben" required autofocus>
                </div>
                <button type="submit" class="btn-primary" style="margin-top: 1rem;">Anmelden</button>
            </form>
        </div>
    </div>
</body>
</html>
