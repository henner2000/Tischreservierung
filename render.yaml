services:
  - type: web
    name: tischreservierung
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORT
        value: admin123
      - key: PYTHON_VERSION
        value: "3.11.11"
